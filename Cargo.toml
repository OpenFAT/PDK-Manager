[package]
name = "pdk-manager"
description = "Schemify plugin: per-project PDK installs (ciel, git, url or a local kit), switching technologies by rewriting the manifest (Schemify docs/spec/pdk.md)."
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/OpenFAT/PDK-Manager"
publish = false

[lib]
name = "pdk_manager"
# cdylib: the wasm guest. rlib: the pure modules (recipes, argv, manifest rewrite, prune plan,
# panel records) are unit-tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
schemify-abi.workspace = true

[dev-dependencies]
# The oracle for the manifest rewrite (canonical text the format writer reproduces) and the
# shipped maps. Not linked into the guest: it would take it past the size limit.
schemify-format.workspace = true
# Drives the built guest through the real host (capability checks included).
schemify-plugin.workspace = true

[lints.rust]
# `deny`, not `forbid`: `guest::export!` allows `unsafe(no_mangle)` on its exports.
unsafe_code = "deny"
missing_docs = "warn"

[workspace]
resolver = "3"

# The Schemify crates, pinned to one Schemify commit. Bump all three together; the nightly CI
# job builds against Schemify `main` to catch drift early.
[workspace.dependencies]
schemify-abi = { git = "https://github.com/OpenFAT/Schemify", rev = "1752960b3906f9b29765222531b5bfe29e8f6542", features = ["guest"] }
schemify-format = { git = "https://github.com/OpenFAT/Schemify", rev = "1752960b3906f9b29765222531b5bfe29e8f6542" }
schemify-plugin = { git = "https://github.com/OpenFAT/Schemify", rev = "1752960b3906f9b29765222531b5bfe29e8f6542" }

# Small module: size over speed, no unwinding (a panic is a trap the host reports).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
