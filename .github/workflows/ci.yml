# Every push and PR: lint, the committed module equals its rebuild, the native and guest tests
# (the guest runs through the real Schemify plugin host at the pinned rev). The dev shell has
# the real schemify-interop (flake input `interop`): the remote-PDK test runs it once it
# speaks pdk-scan, and skips until then.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - run: nix develop -c cargo fmt --check
      - run: nix develop -c cargo clippy --locked --all-targets -- -D warnings
      - run: nix develop -c cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: nix develop -c ./build.sh
      # A PR that changes the module downloads this artifact and commits its pdk_manager.wasm.
      - uses: actions/upload-artifact@v4
        with:
          name: pdk-manager-wasm
          path: pdk_manager.wasm
          if-no-files-found: error
      - run: nix develop -c cargo test --locked --no-fail-fast
      - name: committed module equals the rebuild (reproducible guest)
        run: |
          git diff --quiet -- pdk_manager.wasm && exit 0
          echo "::error::pdk_manager.wasm differs from build.sh output: commit the pdk-manager-wasm artifact of this run"
          exit 1
